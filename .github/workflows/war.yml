# This workflow will build a Java project with Ant
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-ant

name: WAR CI

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:

    runs-on: kalana-ci

    steps:
    - name: Install runner command-line dependencies
      if: runner.os == 'Linux' && runner.environment == 'self-hosted'
      shell: bash
      run: |-
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ant
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up JDK 1.8
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
      with:
        distribution: 'zulu'
        java-version: '8'
    - name: Build war with Ant
      run: |
        cd etc/build
        ant war
    - name: Create Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
      with:
        files: build/draw.war
